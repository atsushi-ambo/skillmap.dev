name: Main Workflow

# すべてのワークフローを統合
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

# 同時実行を完全に防止
concurrency:
  group: "master-workflow-${{ github.ref }}"
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  security-scan:
    name: Security Scan
    uses: atsushi-ambo/ci-workflows/.github/workflows/security.yml@57a00931897b3024e21770b65bd644ced1804512 # v1.0.0
    permissions:
      contents: read

  build-docs:
    name: Build & Deploy Docs
    needs: [security-scan]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install mkdocs-mermaid2-plugin

      - name: Build with MkDocs
        run: |
          mkdocs build --verbose || mkdocs build

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        if: github.event_name != 'pull_request'
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          destination: ./  # Deploy to the root of gh-pages branch
          keep_files: true  # Keep existing files in the gh-pages branch
