name: Main Workflow

# すべてのワークフローを統合
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

# 同時実行を完全に防止
concurrency:
  group: "master-workflow-${{ github.ref }}"
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  security-scan:
    name: Security Scan
    uses: atsushi-ambo/ci-workflows/.github/workflows/security.yml@e32497f0fb113b8a5556c218b4fef1ca398283c2
    permissions:
      contents: read

  build-docs:
    name: Build & Deploy Docs
    needs: [security-scan]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install mkdocs-mermaid2-plugin

      - name: Build with MkDocs
        run: |
          mkdocs build --verbose || mkdocs build

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        if: github.event_name != 'pull_request'
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          destination: ./  # Deploy to the root of gh-pages branch
          keep_files: true  # Keep existing files in the gh-pages branch
